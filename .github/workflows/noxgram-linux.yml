name: NoxGram Linux.

on:
  push:
    branches:
      - noxgram
    # A pushed tag like v7.4.1-nox.1 builds and attaches to its release.
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  pull_request:
    branches:
      - noxgram
  workflow_dispatch:

jobs:

  linux:
    # A push whose commit message has a marker such as [linux-only] builds
    # only the named platforms; several markers may be combined.
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message, '-only]')
      || contains(github.event.head_commit.message, '[linux-only]')
    name: Rocky Linux 8 (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    # Dropping superseded caches needs to delete them.
    permissions:
      contents: write
      actions: write

    strategy:
      fail-fast: false
      matrix:
        config: [Release]
        arch: [x86_64, aarch64]
        defines:
          - ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env
      CONFIG: ${{ matrix.config }}

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: First set up.
        env:
          CCACHE_SHA256: 508b2a1217dc6e04a23e967c7b95a0fb45d8a7e16fde9e180919698f2e2be060
          ARCH: ${{ matrix.arch }}
        run: |
          retry="$GITHUB_WORKSPACE/tools/nagram/retry.sh"
          download=(curl -fsSL --retry 5 --retry-all-errors --retry-delay 10)
          "$retry" 3 30 sudo apt-get update -o Acquire::Retries=3
          # Saved to a file: piped into python3, a failed download went unnoticed.
          "${download[@]}" -o "$RUNNER_TEMP/install-poetry.py" https://install.python-poetry.org
          "$retry" 3 30 python3 "$RUNNER_TEMP/install-poetry.py" --version 2.5.1
          if [ "$ARCH" = x86_64 ]; then
            "${download[@]}" -o "$RUNNER_TEMP/ccache.tar.xz" \
              https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz
            echo "$CCACHE_SHA256  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -
            sudo tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C /usr/local/bin --strip-components=1 \
              ccache-4.13.6-linux-x86_64-glibc/ccache
          else
            # ccache publishes no ARM binaries.
            "$retry" 3 30 sudo apt-get install -y ccache
          fi
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          "$retry" 3 30 poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}-tdesktop-${{ env.CONFIG == 'Release' && 'release-' || '' }}${{ matrix.defines || 'null' }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}-tdesktop-${{ env.CONFIG == 'Release' && 'release-' || '' }}${{ matrix.defines || 'null' }}-

      - name: NoxGram build.
        if: env.ONLY_CACHE == 'false'
        env:
          NAGRAM_API_ID: ${{ secrets.NOXGRAM_API_ID }}
          NAGRAM_API_HASH: ${{ secrets.NOXGRAM_API_HASH }}
          # Report every failing file in one run.
          KEEP_GOING: '1'
        run: |
          # Without the repository secrets, build with the test-only credentials.
          API=""
          if [ -z "$NAGRAM_API_ID" ]; then
            API="-D TDESKTOP_API_TEST=ON"
          fi

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=NoxGram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=NoxGram" >> $GITHUB_ENV
          fi

          ccache -z
          echo "CCACHE_BUILD_START=$(date +%s)" >> $GITHUB_ENV

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG \
          -e KEEP_GOING \
          -e NAGRAM_API_ID \
          -e NAGRAM_API_HASH \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=$CONFIG \
          -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          $API \
          $DEFINE


      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        # Keeps only what this build used: a day of builds is twice the size.
        run: ccache --evict-older-than $(( $(date +%s) - CCACHE_BUILD_START ))s

      - name: Save Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      # Old caches would push the libraries out of the repository quota.
      - name: Drop superseded caches.
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LIBS_KEY: ${{ runner.OS }}${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          TDESKTOP_KEY: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}
        run: bash tools/nagram/drop_superseded_caches.sh "$LIBS_KEY" "$TDESKTOP_KEY"

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/$CONFIG/NoxGram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Move artifact.
        run: |
          cd out/$CONFIG
          mkdir -p artifact package/NoxGram
          cp NoxGram package/NoxGram/
          strip package/NoxGram/NoxGram
          # An artifact does not keep the executable bit, the archive does.
          tar --owner=0 --group=0 --numeric-owner \
            -cJf artifact/NoxGram-linux-${{ matrix.arch }}.tar.xz -C package NoxGram
          echo "ARTIFACT_NAME=NoxGram-linux-${{ matrix.arch }}" >> $GITHUB_ENV
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/${{ env.CONFIG }}/artifact/
          retention-days: 30

      # The three platform jobs race to create the release, the losers
      # just upload into it.
      - name: Publish release.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "NoxGram $TAG" \
              --notes "NoxGram build for testing. macOS: unpack, move to Applications, right-click and choose Open (the app is not notarized)." \
            || true
          gh release upload "$TAG" "out/$CONFIG/artifact/NoxGram-linux-${{ matrix.arch }}.tar.xz" -R "$GITHUB_REPOSITORY" --clobber
